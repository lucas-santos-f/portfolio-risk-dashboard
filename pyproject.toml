[project]
name = "portfolio-risk-dashboard"
version = "0.1.0"
description = "How risky is your portfolio, really? Drawdowns, volatility, correlations and risk contribution."
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PTH"]

[tool.mypy]
python_version = "3.12"
packages = ["portfolio_risk"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["plotly.*", "streamlit.*", "yfinance.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=portfolio_risk --cov-report=term-missing --cov-fail-under=85"
